<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Match Dossier</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">Match Dossier</div>
      <h1>Pick a fixture</h1>
      <div class="tag">Weighted read on H2H, form, injuries, table position and home/away splits.</div>
    </header>

    <section class="card">
      <div class="row">
        <div>
          <label>League</label>
          <select id="league">
            <option value="39">Premier League (England)</option>
            <option value="140">La Liga (Spain)</option>
            <option value="135">Serie A (Italy)</option>
            <option value="78">Bundesliga (Germany)</option>
            <option value="61">Ligue 1 (France)</option>
            <option value="88">Eredivisie (Netherlands)</option>
            <option value="2">UEFA Champions League</option>
          </select>
        </div>
        <div>
          <label>Season</label>
          <input type="number" id="season" value="2025">
        </div>
      </div>
      <button id="loadBtn">Load Fixtures</button>
      <div class="err" id="err"></div>
    </section>

    <section class="card" id="fixCard" style="display:none;">
      <div class="section-title">Upcoming</div>
      <div class="fixlist" id="fixList"></div>
    </section>

    <div id="analysisArea"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
